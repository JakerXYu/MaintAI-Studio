[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai-studio"
version = "0.1.0"
description = "MaintAI Studio — agentic predictive-maintenance AutoML + MLOps copilot (Phase A foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "httpx>=0.27",
    "joblib>=1.3,<2",
    "mlflow>=2.14,<3",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "shap>=0.46,<1",
    "xgboost>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# shap pulls in numba/llvmlite with unconstrained versions; pin them to releases
# that support Python 3.11 and the project's numpy. Without this the universal
# resolver backtracks to numba==0.53.1 / llvmlite==0.36.0, which do not install
# on Python 3.11.
override-dependencies = [
    "numba>=0.67",
    "llvmlite>=0.49",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]
