# MaintAI Studio — demo defaults (Phase A).
# These are DEMO defaults, NOT ABB or any industry standard.
# Override any value via environment variables (see .env.example); env vars and
# `.env` take precedence over this file.

project_name: "MaintAI Studio"
environment: "dev"
random_seed: 42

# Runtime uses Postgres. Tests override DATABASE_URL with SQLite.
database_url: "postgresql+psycopg://maintai:maintai@postgres:5432/maintai"
mlflow_tracking_uri: "http://mlflow:5000"
mlflow_experiment_name: "maintai-p0"

# mock = offline default; no network required
llm_provider: "mock"
llm_base_url: ""
llm_model: ""

api_host: "0.0.0.0"
api_port: 8000
request_id_header: "X-Request-ID"
max_upload_mb: 200

# Controlled storage roots for the API container. Env vars and `.env` override.
dataset_storage_path: "data/uploads"
artifact_storage_path: "data/artifacts"

# Deterministic data-intelligence rules. These are DEMO defaults, NOT any
# industry standard. They mirror the Pydantic defaults in
# src/maintai/data/quality.py and src/maintai/data/split.py.
data:
  missing_warning_rate: 0.05
  missing_severe_rate: 0.20
  duplicate_row_warning_rate: 0.01
  duplicate_row_error_rate: 0.10
  near_constant_unique_ratio: 0.001
  flatline_min_length: 10
  flatline_min_ratio: 0.05
  outlier_mad_threshold: 3.5
  outlier_severe_rate: 0.10
  timestamp_gap_factor: 5.0
  sampling_cv_threshold: 1.0
  asset_imbalance_ratio: 10.0
  target_imbalance_ratio: 20.0
  min_trainable_samples: 100

split:
  test_size: 0.20
  validation_size: 0.20

# Deterministic ML core defaults. These are DEMO defaults, NOT any industry
# standard. They mirror the Pydantic defaults in src/maintai/ml/schemas.py.
ml:
  seed: 42
  n_jobs: 1
  scale_numeric: true
  minimum_recall: 0.80
